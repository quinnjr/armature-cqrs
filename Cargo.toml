[package]
name = "armature-cqrs"
version = "0.1.2"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-cqrs"
homepage = "https://quinnjr.github.io/armature"
description = "CQRS pattern implementation for Armature applications"
keywords = ["cqrs", "command", "query", "event-sourcing"]
categories = ["web-programming", "data-structures"]

[dependencies]
armature-events = { version = "0.3" }
armature-eventsourcing = { version = "0.3" }
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.26", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
dashmap = "6.2"

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio-test = "0.4"

